name: Blog Auto-Publish

on:
  # Automated 3x/day publishing is PAUSED for AdSense/search-quality reasons —
  # a steady firehose of AI posts is a "scaled content" fingerprint. Re-enable
  # by uncommenting the schedule once posts are curated/human-edited.
  # schedule:
  #   - cron: '0 9 * * *'
  #   - cron: '0 14 * * *'
  #   - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Post type (stock or macro)'
        required: false
        default: 'stock'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate blog post
        run: |
          TYPE="${{ github.event.inputs.type || 'stock' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://stockmarketroi.com/api/blog/generate?type=${TYPE}")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Status: $STATUS"
          echo "Response: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::API returned $STATUS"
            exit 1
          fi
