name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /var/www/us-market-hub
          git pull origin main
          npm ci --legacy-peer-deps
          npm run build
          pm2 delete us-market-hub || true
          pm2 start ecosystem.config.js
          pm2 save
          echo "Deploy OK: $(date)" && pm2 list
