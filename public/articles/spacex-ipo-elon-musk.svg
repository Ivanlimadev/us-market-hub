<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background: deep space -->
  <rect width="1200" height="630" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.9">
    <circle cx="45" cy="30" r="1.2"/><circle cx="120" cy="80" r="0.8"/><circle cx="200" cy="25" r="1.5"/>
    <circle cx="310" cy="60" r="0.9"/><circle cx="400" cy="15" r="1.1"/><circle cx="500" cy="45" r="0.7"/>
    <circle cx="590" cy="20" r="1.3"/><circle cx="680" cy="70" r="0.8"/><circle cx="760" cy="35" r="1.0"/>
    <circle cx="850" cy="55" r="1.4"/><circle cx="940" cy="18" r="0.9"/><circle cx="1020" cy="75" r="1.2"/>
    <circle cx="1100" cy="40" r="0.8"/><circle cx="1160" cy="22" r="1.5"/><circle cx="70" cy="150" r="0.7"/>
    <circle cx="160" cy="180" r="1.1"/><circle cx="250" cy="130" r="0.9"/><circle cx="380" cy="170" r="0.8"/>
    <circle cx="470" cy="120" r="1.3"/><circle cx="560" cy="160" r="0.7"/><circle cx="650" cy="140" r="1.0"/>
    <circle cx="740" cy="175" r="0.8"/><circle cx="830" cy="125" r="1.2"/><circle cx="920" cy="165" r="0.9"/>
    <circle cx="1010" cy="135" r="1.4"/><circle cx="1090" cy="158" r="0.7"/><circle cx="1150" cy="120" r="1.1"/>
    <circle cx="30" cy="280" r="0.8"/><circle cx="110" cy="310" r="1.0"/><circle cx="190" cy="260" r="1.3"/>
    <circle cx="330" cy="290" r="0.7"/><circle cx="1050" cy="270" r="1.1"/><circle cx="1130" cy="295" r="0.8"/>
    <circle cx="1180" cy="260" r="1.4"/>
  </g>

  <!-- Earth (bottom-left, partially visible) -->
  <ellipse cx="180" cy="580" rx="220" ry="180" fill="url(#earth-glow)" opacity="0.85"/>
  <!-- Earth cloud bands -->
  <ellipse cx="130" cy="480" rx="160" ry="18" fill="white" opacity="0.08"/>
  <ellipse cx="200" cy="530" rx="130" ry="14" fill="white" opacity="0.06"/>
  <!-- Earth atmosphere glow -->
  <ellipse cx="180" cy="580" rx="240" ry="200" fill="#3b82f6" opacity="0.05" filter="url(#blur-lg)"/>

  <!-- Rocket body -->
  <g transform="translate(900, 80) rotate(25)">
    <!-- Engine glow -->
    <ellipse cx="0" cy="185" rx="35" ry="70" fill="#f97316" opacity="0.4" filter="url(#blur-lg)"/>
    <ellipse cx="0" cy="185" rx="20" ry="45" fill="#fbbf24" opacity="0.6" filter="url(#blur-sm)"/>

    <!-- Rocket body -->
    <rect x="-22" y="-120" width="44" height="240" rx="8" fill="#e2e8f0"/>
    <!-- Rocket nose -->
    <path d="M-22,-120 Q0,-200 22,-120 Z" fill="#cbd5e1"/>
    <!-- Body detail lines -->
    <line x1="-22" y1="-60" x2="22" y2="-60" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    <line x1="-22" y1="20" x2="22" y2="20" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    <line x1="-22" y1="80" x2="22" y2="80" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>

    <!-- SpaceX logo area -->
    <rect x="-18" y="-40" width="36" height="20" rx="3" fill="#1e293b" opacity="0.6"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8" fill="#94a3b8">SPACEX</text>

    <!-- Fins -->
    <path d="M-22,100 L-50,180 L-22,155 Z" fill="#cbd5e1"/>
    <path d="M22,100 L50,180 L22,155 Z" fill="#cbd5e1"/>

    <!-- Engine nozzles -->
    <ellipse cx="-10" cy="165" rx="9" ry="6" fill="#475569"/>
    <ellipse cx="10" cy="165" rx="9" ry="6" fill="#475569"/>

    <!-- Flames -->
    <path d="M-10,171 Q-15,220 -8,240 Q-4,255 0,260 Q4,255 8,240 Q15,220 10,171 Z" fill="#f97316" opacity="0.9"/>
    <path d="M-10,171 Q-8,210 -4,225 Q0,235 4,225 Q8,210 10,171 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M-4,171 Q-2,200 0,210 Q2,200 4,171 Z" fill="white" opacity="0.6"/>
  </g>

  <!-- Chart overlay (stock chart going up) -->
  <g opacity="0.25">
    <polyline points="100,500 200,470 330,450 430,420 530,390 630,350 730,310 830,260 930,200"
      fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="100,500 200,470 330,450 430,420 530,390 630,350 730,310 830,260 930,200 930,560 100,560"
      fill="#10b981" opacity="0.15"/>
  </g>

  <!-- IPO text glow -->
  <text x="140" y="340" font-family="Arial,sans-serif" font-weight="900" font-size="90" fill="#3b82f6" opacity="0.08" filter="url(#blur-lg)">IPO</text>

  <!-- Main overlay gradient (left side for text) -->
  <linearGradient id="text-overlay" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#000010" stop-opacity="0.92"/>
    <stop offset="60%" stop-color="#000010" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
  </linearGradient>
  <rect width="800" height="630" fill="url(#text-overlay)"/>

  <!-- Tag -->
  <rect x="48" y="60" width="130" height="28" rx="14" fill="#10b981" opacity="0.2"/>
  <rect x="48" y="60" width="130" height="28" rx="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <text x="113" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10b981">MARKET ANALYSIS</text>

  <!-- Main title -->
  <text x="48" y="160" font-family="Arial,sans-serif" font-weight="900" font-size="56" fill="white">SpaceX IPO:</text>
  <text x="48" y="228" font-family="Arial,sans-serif" font-weight="900" font-size="46" fill="white">The $400B</text>
  <text x="48" y="290" font-family="Arial,sans-serif" font-weight="900" font-size="46" fill="white">Question</text>

  <!-- Subtitle -->
  <text x="48" y="340" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8">Will Elon Musk take the world's most</text>
  <text x="48" y="365" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8">valuable private company public?</text>

  <!-- Divider -->
  <line x1="48" y1="395" x2="300" y2="395" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- Meta -->
  <text x="48" y="425" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Stock Market ROI  ·  June 2026  ·  8 min read</text>

  <!-- Valuation badge -->
  <rect x="48" y="460" width="220" height="64" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="68" y="483" font-family="Arial,sans-serif" font-size="11" fill="#64748b">CURRENT VALUATION</text>
  <text x="68" y="510" font-family="Arial,sans-serif" font-weight="900" font-size="28" fill="#3b82f6">$400B+</text>

  <rect x="290" y="460" width="200" height="64" rx="12" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
  <text x="310" y="483" font-family="Arial,sans-serif" font-size="11" fill="#64748b">PROJECTED IPO</text>
  <text x="310" y="510" font-family="Arial,sans-serif" font-weight="900" font-size="28" fill="#10b981">2026–27</text>

  <!-- Bottom branding -->
  <text x="48" y="592" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#334155">stockmarketroi.com</text>
</svg>
